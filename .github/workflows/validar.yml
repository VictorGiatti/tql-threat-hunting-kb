name: validar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Autoteste do validador TQL
        run: python scripts/tqlcheck.py --self-test
      - name: Lint das queries
        run: python scripts/kb.py lint
      - name: Amostras de linha de comando
        run: python scripts/kb.py test
      - name: Índice, README e painel em sincronia
        run: python scripts/kb.py check
